name: ffmpeg newline test

# ubuntu-latest（26.04 / ffmpeg 8）で drawtext の改行が □ になるかを、24.04（ffmpeg 6）と比べる。
on:
  workflow_dispatch:
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - .github/workflows/ffmpeg_newline_test.yml

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install -q requests
          ffmpeg -version | head -1
          mkdir -p assets/fonts out
          python scripts/download_fonts.py || true
          printf 'ミステリーウェイは2021\n年1月に栗東・安田隆行厩舎\nからデビューしました' > t.txt
          i=0
          for f in assets/fonts/*.ttf /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc; do
            i=$((i+1))
            ffmpeg -y -loglevel error -f lavfi -i color=c=gray:s=900x300 -vframes 1 \
              -vf "drawtext=fontfile='$f':textfile=t.txt:fontsize=48:fontcolor=white:x=20:y=20:line_spacing=10" \
              out/${{ matrix.os }}_$i.png
            echo "$i $f"
          done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            git fetch -q origin research-output && git checkout -q -B ro FETCH_HEAD
            mkdir -p sim/nltest && cp out/*.png sim/nltest/
            git add sim/nltest && git commit -qm "改行テスト ${{ matrix.os }} [skip ci]" && git push -q origin ro:research-output && break
            sleep $((n*3))
          done

name: WIN5 Data Fetch

# WIN5予想用に netkeiba の5走表示を取得してブランチにコミットする（YouTube投稿なし）。
on:
  push:
    branches:
      - claude/melbourne-cup-highlights-89j2ds
    paths:
      - scripts/win5_fetch.py
      - .github/workflows/win5_fetch.yml
      - win5_races.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Fetch races
        run: python scripts/win5_fetch.py $(grep -v '^#' win5_races.txt)

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add win5_data
          git commit -m "chore: WIN5 data fetch [skip ci]" || echo "no changes"
          git push

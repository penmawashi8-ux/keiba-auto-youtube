name: Dream Race Simulation probe (temporary)

# netkeiba のレース検索ページの取得方法を調べる一時的なワークフロー（調査が済んだら削除する）
on:
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - scripts/sim_probe.py
      - .github/workflows/sim_probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests==2.32.3 beautifulsoup4
      - run: python scripts/sim_probe.py

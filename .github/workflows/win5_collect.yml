name: WIN5 Backtest Collect

# WIN5バックテスト用に過去のWIN5対象レースの5走表示と結果を収集する（YouTube投稿なし）。
# 途中で時間切れになっても保存済み分はコミットされ、次回実行で続きから再開する。
on:
  push:
    branches:
      - claude/melbourne-cup-highlights-89j2ds
    paths:
      - scripts/win5_bt/collect_range.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win5-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Collect
        run: python scripts/win5_bt/collect.py $(grep -v '^#' scripts/win5_bt/collect_range.txt) 150
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add win5_bt_data
          git commit -q -m "chore: WIN5 backtest collect [skip ci]" || echo "no changes"
          git pull --rebase -q
          git push

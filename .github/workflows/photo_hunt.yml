name: Photo hunt (Flickr / Geograph / Unsplash / Pexels / Pixabay)

# data/photo_hunt/*.json の馬の自由ライセンス写真を Wikimedia 以外のサイトで探し、
# research-output の sim/photo_hunt/<名前>/ に保存する
on:
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - data/photo_hunt/**
      - scripts/photo_hunt.py
      - .github/workflows/photo_hunt.yml

jobs:
  hunt:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - run: |
          for f in data/photo_hunt/*.json; do
            n=$(basename "$f" .json)
            python scripts/photo_hunt.py "$f" "out/$n"
          done
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            git fetch -q origin research-output && git checkout -q -f -B ro FETCH_HEAD
            mkdir -p sim/photo_hunt && cp -r out/* sim/photo_hunt/
            git add -f sim/photo_hunt && git commit -qm "写真探し・他サイト (run ${GITHUB_RUN_ID}) [skip ci]" && git push -q origin ro:research-output && break
            sleep $((n*3))
          done

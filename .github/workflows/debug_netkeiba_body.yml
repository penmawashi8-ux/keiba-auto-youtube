name: Debug netkeiba body (temporary)

# netkeiba記事の本文が抜粋しか取れない原因調査用（一時的・本番無影響）
on:
  push:
    branches:
      - claude/horizontal-video-auto-post-image-tfzer9
    paths:
      - .github/workflows/debug_netkeiba_body.yml
      - scripts/fetch_news.py

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run fetch_news and show body lengths
        run: |
          python scripts/fetch_news.py > /tmp/fetch.log 2>&1 || true
          grep -E "抽出方法|取得:|除外:teaser" /tmp/fetch.log | head -60
          python - <<'PYEOF'
          import json
          for it in json.load(open("news.json")):
              print("-" * 60)
              print(it["title"][:70])
              print(f"summary({len(it['summary'])}字):", it["summary"][:120], "...", it["summary"][-200:])
          PYEOF

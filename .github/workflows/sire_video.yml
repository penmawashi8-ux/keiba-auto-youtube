name: Sire Offspring Ranking Video (landscape)

# 産駒の獲得賞金ランキングの横動画（1920×1080）を data/sire_video/*.json から作る。
# 動画・サムネイル・写真の出典・確認用フレームは research-output ブランチの sim/ に保存する（投稿はしない）。
on:
  workflow_dispatch:
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - data/sire_video/**
      - scripts/sire_ranking_video.py
      - .github/workflows/sire_video.yml

concurrency:
  group: sire-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # research-output ブランチへの push 用
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install requests==2.32.3 beautifulsoup4 edge-tts certifi

      - name: Make videos
        env:
          THUMB_ONLY: ${{ contains(github.event.head_commit.message, '[thumb]') }}
        run: |
          mkdir -p sim
          # 今回のコミットで変わった設定だけ作る（スクリプトの変更など、設定が変わっていなければ全部）
          files=$(git diff --name-only HEAD~1 HEAD -- 'data/sire_video/*.json' || true)
          [ -z "$files" ] && files=$(ls data/sire_video/*.json)
          echo "$files" > sim/sire_video_targets.txt
          for f in $files; do
            # コミットの見出しに [thumb] があればサムネイルだけ作り直す（動画は前回のまま）
            if [ "$THUMB_ONLY" = "true" ]; then
              python -u scripts/sire_ranking_video.py "$f" --thumb-only
            else
              python -u scripts/sire_ranking_video.py "$f"
            fi
          done

      - name: Save outputs to research-output branch
        if: always()
        run: |
          for f in $(cat sim/sire_video_targets.txt); do
            p=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['prefix'])" "$f")
            bash .github/scripts/save_sim_outputs.sh "産駒ランキング動画 $p" sim/$p.mp4 sim/${p}_thumb.jpg sim/${p}_credits.txt sim/${p}_frame_*.jpg
          done

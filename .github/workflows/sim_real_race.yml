name: Real Race Simulation Video

# 実際のレース（既定: 2026-10-25 菊花賞）のシミュレーション動画を作る。
# 出馬表を取り直す（枠順確定後なら正式な馬番になる）→ 出走馬の成績を最新に → 1万回シミュレーション → 動画。
# データ（対戦相手の成績など）は先に sim_race_prep.yml で集めておくこと。
# 結果は research-output ブランチの sim/ に保存する（投稿はしない）。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "開催日 YYYYMMDD"
        default: "20261025"
      race:
        description: "レース名（netkeiba のレース一覧の表記）"
        default: "菊花賞"
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - scripts/sim_real_race.py
      - scripts/sim_gate_effect.py
      - scripts/sim_entries.py
      - scripts/sim_render.py
      - scripts/sim_bgm.py
      - .github/workflows/sim_real_race.yml

env:
  RACE_DATE: ${{ github.event.inputs.date || '20261025' }}
  RACE_NAME: ${{ github.event.inputs.race || '菊花賞' }}

# 夢の対決・データ集めとは別のグループにする（同じグループだと、待っている実行が後から来た実行に
# 置き換えられてキャンセルされる）。research-output への保存は save_sim_outputs.sh が再試行する
concurrency:
  group: sim-real-race
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # research-output ブランチへの push 用
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install requests==2.32.3 beautifulsoup4 edge-tts certifi

      - name: Restore data from research-output
        run: |
          mkdir -p sim
          git fetch -q origin research-output
          for f in races_cache.json races.json horses_cache.json; do
            git show FETCH_HEAD:sim/$f > sim/$f && echo "復元 $f: $(wc -c < sim/$f) bytes"
          done
          git show FETCH_HEAD:sim/gate_cache.json > sim/gate_cache.json 2>/dev/null || rm -f sim/gate_cache.json

      - name: Refresh entries and entrants' careers
        run: |
          python scripts/sim_entries.py "$RACE_DATE" "$RACE_NAME"
          ids=$(python -c "import json; print(' '.join(h['horse_id'] for h in json.load(open('sim/entries.json'))['horses']))")
          python scripts/sim_fetch_horses.py 10 --refresh $ids

      # 枠順の有利不利を、同じコースの過去レース（馬番・オッズ付きの結果ページ）から測る
      - name: Measure gate (draw) effect for this course
        run: python scripts/sim_gate_effect.py 35

      # 枠×脚質を測るには過去レースの出走馬の「普段の脚質」が要るので、その馬たちの成績も取る（新しい馬から）
      - name: Fetch careers of past runners on this course (time-boxed, resumes next run)
        run: |
          python - <<'PY' > sim/gate_runner_ids.txt
          import json
          cache = json.load(open("sim/gate_cache.json"))
          have = set(json.load(open("sim/horses_cache.json")))
          ids = {x["horse_id"] for r in cache.values() for x in r["runners"] if x.get("horse_id")} - have
          print("\n".join(sorted(ids, reverse=True)))
          PY
          echo "未取得 $(wc -l < sim/gate_runner_ids.txt)頭"
          python scripts/sim_fetch_horses.py 30 $(cat sim/gate_runner_ids.txt)
          python scripts/sim_gate_effect.py 1

      - name: Save gate data
        run: bash .github/scripts/save_sim_outputs.sh "枠順データ ${RACE_NAME}" sim/gate_cache.json sim/gate_effect.json sim/horses_cache.json

      - name: Simulate and render
        run: python scripts/sim_real_race.py

      - name: Save outputs to research-output branch
        if: success()
        run: bash .github/scripts/save_sim_outputs.sh "レース動画 ${RACE_NAME}" sim/real_report.md sim/real_result.json sim/real_race.mp4 sim/real_frame_*.jpg sim/entries.json sim/horses_cache.json sim/gate_effect.json

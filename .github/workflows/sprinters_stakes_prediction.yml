name: スプリンターズS2026 最終予想動画（横型）生成・投稿

on:
  # ブランチへのpush時は動画生成のみ（YouTube投稿は手動実行時だけ）
  push:
    branches:
      - claude/sprinters-stakes-2026-prediction-0ka270
    paths:
      - scripts/create_sprinters_prediction.py
      - scripts/sprinters_slide_video.py
      - scripts/make_prediction_bgm.py
      - .github/workflows/sprinters_stakes_prediction.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テストモード（YouTubeにアップせずArtifactのみ）"
        required: false
        default: false
        type: boolean

jobs:
  post-sprinters-landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            libfontconfig1
          echo "ffmpeg version: $(ffmpeg -version 2>&1 | head -1)"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: スプリンターズS2026 最終予想コンテンツを生成
        run: python scripts/create_sprinters_prediction.py

      - name: スライド形式の予想動画を生成（横型 1280×720・ナレーション付き）
        env:
          TTS_VOICE: ja-JP-KeitaNeural
        run: python scripts/sprinters_slide_video.py

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprinters-2026-landscape-video
          path: |
            output/landscape_video_0.mp4
            output/thumbnail_0.jpg
          retention-days: 7

      - name: Upload to YouTube
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != true }}
        env:
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID_2:     ${{ secrets.GOOGLE_CLIENT_ID2 }}
          GOOGLE_CLIENT_SECRET_2: ${{ secrets.GOOGLE_CLIENT_SECRET2 }}
          GOOGLE_REFRESH_TOKEN_2: ${{ secrets.GOOGLE_REFRESH_TOKEN_2 }}
          GOOGLE_CLIENT_ID_3:     ${{ secrets.GOOGLE_CLIENT_ID3 }}
          GOOGLE_CLIENT_SECRET_3: ${{ secrets.GOOGLE_CLIENT_SECRET3 }}
          GOOGLE_REFRESH_TOKEN_3: ${{ secrets.GOOGLE_REFRESH_TOKEN3 }}
        run: python scripts/upload_landscape_youtube.py

      - name: Commit and push
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_landscape_ids.txt last_upload_result.txt output/thumbnail_*.jpg 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: スプリンターズS2026最終予想動画（横型）投稿完了 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

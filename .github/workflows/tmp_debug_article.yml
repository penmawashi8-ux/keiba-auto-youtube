name: tmp debug article extraction
on:
  push:
    branches: [claude/sprinters-stakes-2026-prediction-0ka270]
    paths: [.github/workflows/tmp_debug_article.yml]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: fetch + script (no upload)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import fetch_popular_news as f
          f.MAX_AGE_HOURS = 24 * 30
          item = f.build_news_item("344432", "https://news.netkeiba.com/?pid=news_view&no=344432",
                                   "【秋華賞想定馬・騎手】ジュウリョクピエロ、モンローウォークなど18頭", 96901)
          print("SUMMARY:\n" + item["summary"])
          json.dump([item], open("news.json", "w"), ensure_ascii=False, indent=2)
          PY
          python scripts/generate_script.py
          echo "===== SCRIPT ====="
          cat output/script_0.txt

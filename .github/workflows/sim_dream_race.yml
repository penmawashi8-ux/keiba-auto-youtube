name: Dream Race Simulation (prototype)

# 夢の対決シミュレーションの試作。netkeiba から JRA芝重賞の全出走馬成績を取得し、
# バックテストで計算方法を選んだうえで仮想レースを1万回走らせる。
# 結果（レポート・アニメーション・静止画・取得データ）は research-output ブランチの sim/ に保存する（投稿はしない）。
on:
  workflow_dispatch:
    inputs:
      horses:
        description: "馬名=netkeibaID をスペース区切り"
        default: "ディープインパクト=2002100816 オルフェーヴル=2008102636 キタサンブラック=2012102013 アーモンドアイ=2015104961 イクイノックス=2019105219"
  push:
    branches:
      - claude/youtube-keiba-video-research-x6jdvw
    paths:
      - scripts/sim_fetch.py
      - scripts/sim_fetch_horses.py
      - scripts/sim_model.py
      - scripts/sim_dream_race.py
      - .github/workflows/sim_dream_race.yml

env:
  DEFAULT_HORSES: "ディープインパクト=2002100816 オルフェーヴル=2008102636 キタサンブラック=2012102013 アーモンドアイ=2015104961 イクイノックス=2019105219"

# netkeiba への同時アクセスを避けるため、実行は1本ずつ（後から来た実行は待つ）
concurrency:
  group: sim-dream-race
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 130  # 馬ページの取得は100分で区切り、残りは次回の実行で続きから取る
    permissions:
      contents: write  # research-output ブランチへの push 用
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pip install requests==2.32.3 beautifulsoup4

      - name: Restore fetch caches from research-output
        run: |
          mkdir -p sim
          git fetch -q origin research-output || true
          for f in races_cache.json horses_cache.json; do
            git show FETCH_HEAD:sim/$f > sim/$f 2>/dev/null \
              && echo "キャッシュ復元 $f: $(wc -c < sim/$f) bytes" || { rm -f sim/$f; echo "キャッシュなし $f"; }
          done

      - name: Fetch graded race results
        run: python scripts/sim_fetch.py 2003 2025

      - name: Fetch full careers of graded runners (time-boxed, resumes next run)
        run: python scripts/sim_fetch_horses.py 100

      - name: Save fetched data to research-output branch
        run: bash .github/scripts/save_sim_outputs.sh "取得データ" sim/races_cache.json sim/races.json sim/horses_cache.json

      - name: Backtest, simulate and render
        # 全馬の成績がそろうまでは取得だけ行う（次の実行で続きを取る）
        if: hashFiles('sim/horses_done') != ''
        run: python scripts/sim_dream_race.py ${{ github.event.inputs.horses || env.DEFAULT_HORSES }}

      - name: Save outputs to research-output branch
        if: hashFiles('sim/horses_done') != ''
        run: bash .github/scripts/save_sim_outputs.sh "夢の対決シミュレーション試作" sim/report.md sim/result.json sim/race.mp4 sim/frame_*.jpg
